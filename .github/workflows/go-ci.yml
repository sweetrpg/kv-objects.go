    #              uses: peaceiris/actions-gh-pages@v3
    #              with:
    #                  github_token: ${{ secrets.GITHUB_TOKEN }}
    #                  publish_dir: ./docs/_build/html

    tag:
        needs: [tests]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        concurrency: publish
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Bump version and push tag
              uses: anothrNick/github-tag-action@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  WITH_V: true
                  DEFAULT_BUMP: patch

    notify:
        needs: [tag]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - repo: api-core.go
                    - repo: catalog-api
                    - repo: catalog-data.go
                    - repo: catalog-data-processor
                    - repo: catalog-objects.go
                    - repo: catalog-web
                    - repo: client.go
                    - repo: data-api
                    - repo: data-objects.go
                    - repo: db.go
                    - repo: initiative-api
                    - repo: initiative-data.go
                    - repo: initiative-objects.go
                    - repo: initiative-web
                    - repo: kv-api
                    - repo: kv-data.go
                    - repo: kv-expression-processor
                    - repo: kv-key-processor
                    - repo: kv-objects.go
                    - repo: kv-value-calculator
                    - repo: kv-web
                    - repo: library-api
                    - repo: library-data.go
                    - repo: library-objects.go
                    - repo: library-web
                    - repo: main-web
                    - repo: model-core.go
                    - repo: shared-web
                    - repo: web-core
        steps:
            - uses: juztcode/repo-ditpatch-action@v1
              continue-on-error: true
              with:
                event-type: catalog-objects-published
                token: ${{ secrets.REPO_ACCESS_TOKEN }}
                repository: sweetrpg/${{ matrix.repo }}
